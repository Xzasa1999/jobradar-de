 sc=Object.entries(R).map(([k,re])=>[k,(x.match(re)||[]).length]).sort((a,b)=>b[1]-a[1]),a=S.apps[i];a.last=Date.now();
 if(sc[0][1]>=2&&sc[0][1]>sc[1][1]){a.status={interview:'interview',docs:'docs',rejected:'rejected',accepted:'accepted'}[sc[0][0]];a.review=0;note('nReply',a.t,t('s_'+a.status))}else{a.review=1;if(a.status==='sent')a.status='reply';alert(t('lowc'));note('nReply',a.t,t('s_review'))}
